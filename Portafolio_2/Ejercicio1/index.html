<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1: Permisos y Geolocalización</title>
  <link rel="stylesheet" href="estilos.css">
  <!-- Leaflet CSS para el mapa interactivo -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div class="container">
    <h1>Ejercicio 1: Permisos y Geolocalización</h1>

    <!-- Sección de Permisos -->
    <div class="card">
      <h2>Estado del Permiso (Permissions API)</h2>
      <p>Estado de geolocalización: <span id="permission-status" class="badge">Consultando...</span></p>
    </div>

    <!-- Sección de Geolocalización -->
    <div class="card">
      <h2>Obtener Geolocalización</h2>
      <button id="btn-location">Obtener mi ubicación GPS</button>

      <div id="coords-box" class="coords-box" style="display: none;">
        <p><strong>Latitud:</strong> <span id="latitude">-</span></p>
        <p><strong>Longitud:</strong> <span id="longitude">-</span></p>
        <p><strong>Precisión:</strong> ±<span id="accuracy">-</span> metros</p>
      </div>

      <!-- Contenedor del Mapa -->
      <div id="map"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
